name: Godot build

# The Godot version of the game (consoles and phones; see docs/console/ENGINE.md): translates
# the TypeScript (tools/gdport), checks the rules against the TypeScript game (golden tests),
# then exports Windows, Linux, macOS and Android builds as downloadable artifacts
# (Actions tab -> the run -> Artifacts). The Electron desktop builds are desktop.yml.
# The Android APK also goes onto the GitHub release for package.json's version (the website's
# Android button downloads it from the latest release): the first time that version has a
# release, or whenever this is run by hand with "publish" ticked.
#
# Android signing: with the ANDROID_KEYSTORE_BASE64 and ANDROID_KEYSTORE_PASSWORD secrets set
# (alias "cageboss"), the APK is release-signed with that key, so every update installs over the
# previous one. Without them it falls back to a throwaway key (each build then needs
# uninstalling the old one first).
on:
  workflow_dispatch:
    inputs:
      publish:
        description: Put the Android APK on the latest release even if it already has one
        type: boolean
        default: false
  push:
    branches: ['main', 'master', 'claude/**']
    paths: ['src/**', 'data/**', 'public/**', 'port/godot/**', 'tools/gdport/**', 'tools/golden/**', '.github/workflows/godot.yml']

concurrency:
  group: godot-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write
  actions: read

env:
  GODOT_VERSION: '4.5'

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm ci
        working-directory: tools/gdport
      - name: ffmpeg (the .m4a songs become .ogg)
        run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg
      - name: Godot and export templates
        run: |
          mkdir -p "$HOME/godot" "$HOME/.local/share/godot/export_templates/${GODOT_VERSION}.stable"
          cd "$HOME/godot"
          curl -sSL -o godot.zip "https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-stable/Godot_v${GODOT_VERSION}-stable_linux.x86_64.zip"
          unzip -q godot.zip && mv "Godot_v${GODOT_VERSION}-stable_linux.x86_64" godot
          curl -sSL -o tpl.tpz "https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-stable/Godot_v${GODOT_VERSION}-stable_export_templates.tpz"
          unzip -q -j tpl.tpz 'templates/version.txt' 'templates/linux_release.x86_64' 'templates/windows_release_x86_64.exe' 'templates/macos.zip' 'templates/android_release.apk' 'templates/android_debug.apk' -d "$HOME/.local/share/godot/export_templates/${GODOT_VERSION}.stable"
          rm tpl.tpz
          echo "GODOT=$HOME/godot/godot" >> "$GITHUB_ENV"
      - name: Translate the game
        run: tools/gdport/build.sh
      - name: Golden tests (the Godot rules match the TypeScript game)
        run: T=1800 tools/golden/run.sh
      - name: Android SDK / signing for the editor
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASS: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: |
          keytool -genkeypair -v -keystore "$HOME/debug.keystore" -storepass android -alias androiddebugkey -keypass android -dname "CN=Android Debug,O=Android,C=US" -keyalg RSA -keysize 2048 -validity 10000
          mkdir -p "$HOME/.config/godot"
          cat > "$HOME/.config/godot/editor_settings-${GODOT_VERSION}.tres" <<EOF
          [gd_resource type="EditorSettings" format=3]

          [resource]
          export/android/android_sdk_path = "$ANDROID_SDK_ROOT"
          export/android/java_sdk_path = "$JAVA_HOME_17_X64"
          export/android/debug_keystore = "$HOME/debug.keystore"
          export/android/debug_keystore_user = "androiddebugkey"
          export/android/debug_keystore_pass = "android"
          EOF
          if [ -n "$KEYSTORE_B64" ] && [ -n "$KEYSTORE_PASS" ]; then
            printf '%s' "$KEYSTORE_B64" | base64 -d > "$HOME/release.keystore"
            {
              echo "GODOT_ANDROID_KEYSTORE_RELEASE_PATH=$HOME/release.keystore"
              echo "GODOT_ANDROID_KEYSTORE_RELEASE_USER=cageboss"
              echo "GODOT_ANDROID_KEYSTORE_RELEASE_PASSWORD=$KEYSTORE_PASS"
            } >> "$GITHUB_ENV"
          else
            echo "::warning::No Android release key (ANDROID_KEYSTORE_BASE64 / ANDROID_KEYSTORE_PASSWORD secrets): the APK is signed with a throwaway key"
            {
              echo "GODOT_ANDROID_KEYSTORE_RELEASE_PATH=$HOME/debug.keystore"
              echo "GODOT_ANDROID_KEYSTORE_RELEASE_USER=androiddebugkey"
              echo "GODOT_ANDROID_KEYSTORE_RELEASE_PASSWORD=android"
            } >> "$GITHUB_ENV"
          fi
      - name: Android version from package.json
        working-directory: port/godot
        run: |
          v=$(node -p "require('../../package.json').version")
          code=$(node -p "const [a,b,c]=require('../../package.json').version.split('.').map(Number); a*10000+b*100+c")
          sed -i "s/^version\/name=.*/version\/name=\"$v\"/; s/^version\/code=.*/version\/code=$code/" export_presets.cfg
          grep -n '^version/' export_presets.cfg
      - name: Export
        working-directory: port/godot
        run: |
          mkdir -p build/windows build/linux build/macos build/android
          "$GODOT" --headless --path . --export-release "Windows" "build/windows/CAGE BOSS.exe"
          "$GODOT" --headless --path . --export-release "Linux" build/linux/cageboss.x86_64
          "$GODOT" --headless --path . --export-release "macOS" "build/macos/CAGE BOSS.zip"
          "$GODOT" --headless --path . --export-release "Android" build/android/CAGE-BOSS-Android.apk
          test -s build/android/CAGE-BOSS-Android.apk
          ls -la build/*
      - uses: actions/upload-artifact@v4
        with:
          name: cageboss-godot-windows
          path: port/godot/build/windows
      - uses: actions/upload-artifact@v4
        with:
          name: cageboss-godot-linux
          path: port/godot/build/linux
      - uses: actions/upload-artifact@v4
        with:
          name: cageboss-godot-macos
          path: port/godot/build/macos
      - uses: actions/upload-artifact@v4
        with:
          name: cageboss-godot-android
          path: port/godot/build/android
          if-no-files-found: error
      - name: Android APK onto the release
        env:
          GH_TOKEN: ${{ github.token }}
          FORCE: ${{ inputs.publish }}
        run: |
          v="v$(node -p "require('./package.json').version")"
          apk=port/godot/build/android/CAGE-BOSS-Android.apk
          # a version bump: desktop.yml is making the release right now, so wait for it (or for
          # that run to end without one)
          for i in $(seq 1 60); do
            if gh release view "$v" >/dev/null 2>&1; then break; fi
            st=$(gh run list --workflow desktop.yml --commit "$GITHUB_SHA" --json status -q '.[0].status' 2>/dev/null || true)
            if [ "$st" = completed ] && ! gh release view "$v" >/dev/null 2>&1; then echo "No release $v for this commit"; exit 0; fi
            [ -z "$st" ] && [ "$i" -gt 4 ] && { echo "No release $v and no desktop build for this commit"; exit 0; }
            sleep 30
          done
          gh release view "$v" >/dev/null 2>&1 || { echo "Release $v didn't appear"; exit 0; }
          has=$(gh release view "$v" --json assets -q 'any(.assets[]; .name == "CAGE-BOSS-Android.apk")')
          if [ "$has" = true ] && [ "$FORCE" != true ]; then echo "$v already has an APK"; exit 0; fi
          gh release upload "$v" "$apk" --clobber
          echo "Uploaded CAGE-BOSS-Android.apk to $v"
