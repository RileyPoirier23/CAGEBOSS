name: Desktop build

# Builds the Windows game (installer + portable .exe) on a real Windows runner.
# Every push to main or a claude/* branch uploads the .exe files as a downloadable
# artifact (Actions tab -> the run -> Artifacts). Pushing a tag like v0.2.0 also
# publishes a GitHub Release with the downloads attached.
on:
  workflow_dispatch:
  push:
    branches: ['main', 'master', 'claude/**']
    tags: ['v*']
    paths-ignore: ['**.md']

permissions:
  contents: write

concurrency:
  group: desktop-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Version from tag
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: npm version "${GITHUB_REF_NAME#v}" --no-git-tag-version --allow-same-version
      - run: npm test
      - run: npm run dist:win
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      - name: Stable download names (for links on the website)
        shell: bash
        run: |
          cp release/CAGE-BOSS-*-setup.exe release/CAGE-BOSS-Setup.exe
          cp release/CAGE-BOSS-*-portable.exe release/CAGE-BOSS-Portable.exe
      - uses: actions/upload-artifact@v4
        with:
          name: CAGE-BOSS-windows
          path: |
            release/*.exe
            release/latest.yml
          if-no-files-found: error
      # A release goes out for a v* tag, or automatically when package.json's version
      # is bumped and no release for that version exists yet.
      - name: Release needed?
        id: rel
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          v="v$(node -p "require('./package.json').version")"
          echo "tag=$v" >> "$GITHUB_OUTPUT"
          if gh release view "$v" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then echo "needed=false" >> "$GITHUB_OUTPUT"; else echo "needed=true" >> "$GITHUB_OUTPUT"; fi
      # release notes come from the commit message (the website's "What's new" reads them)
      - name: Release notes
        if: startsWith(github.ref, 'refs/tags/v') || steps.rel.outputs.needed == 'true'
        shell: bash
        env:
          MSG: ${{ github.event.head_commit.message }}
        run: |
          printf '%s\n' "${MSG:-New build of CAGE BOSS.}" | grep -viE '^(co-authored-by|claude-session):' > release-notes.md || echo "New build of CAGE BOSS." > release-notes.md
      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/v') || steps.rel.outputs.needed == 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.rel.outputs.tag }}
          target_commitish: ${{ github.sha }}
          name: CAGE BOSS ${{ steps.rel.outputs.tag }}
          body_path: release-notes.md
          # latest.yml + .blockmap are what installed copies read to update themselves
          files: |
            release/*.exe
            release/*.blockmap
            release/latest.yml
