name: Desktop build

# Builds the Windows game (installer + portable .exe) on a real Windows runner.
# Every push to main or a claude/* branch uploads the .exe files as a downloadable
# artifact (Actions tab -> the run -> Artifacts). Pushing a tag like v0.2.0 also
# publishes a GitHub Release with the downloads attached.
on:
  workflow_dispatch:
  push:
    branches: ['main', 'master', 'claude/**']
    tags: ['v*']
    paths-ignore: ['**.md']

permissions:
  contents: write

concurrency:
  group: desktop-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run dist:win
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      - uses: actions/upload-artifact@v4
        with:
          name: CAGE-BOSS-windows
          path: |
            release/*.exe
          if-no-files-found: error
      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: release/*.exe
