name: Desktop build

# Builds the desktop game on real runners: Windows (installer + portable .exe) on every push,
# and Mac (Apple Silicon + Intel .dmg) and Linux (AppImage + tar.gz) whenever a release goes
# out. Every run uploads its builds as downloadable artifacts (Actions tab -> the run ->
# Artifacts). A release goes out for a v* tag, or automatically when package.json's version is
# bumped and no release for that version exists yet; it carries all three platforms.
on:
  workflow_dispatch:
  push:
    branches: ['main', 'master', 'claude/**']
    tags: ['v*']
    paths-ignore: ['**.md']

permissions:
  contents: write

concurrency:
  group: desktop-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.rel.outputs.tag }}
      release: ${{ steps.rel.outputs.release }}
      allplatforms: ${{ steps.rel.outputs.allplatforms }}
    steps:
      - uses: actions/checkout@v4
      - name: Release needed?
        id: rel
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then v="$GITHUB_REF_NAME"; else v="v$(node -p "require('./package.json').version")"; fi
          echo "tag=$v" >> "$GITHUB_OUTPUT"
          if [[ "$GITHUB_REF" == refs/tags/v* ]] || ! gh release view "$v" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then rel=true; else rel=false; fi
          echo "release=$rel" >> "$GITHUB_OUTPUT"
          # Mac and Linux builds are slower (and Mac runners cost more): only for releases, or when asked
          if [[ "$rel" == true || "$GITHUB_EVENT_NAME" == workflow_dispatch ]]; then echo "allplatforms=true" >> "$GITHUB_OUTPUT"; else echo "allplatforms=false" >> "$GITHUB_OUTPUT"; fi

  windows:
    needs: check
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Version from tag
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: npm version "${GITHUB_REF_NAME#v}" --no-git-tag-version --allow-same-version
      - run: npm test
      - run: npm run dist:win
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      - name: Stable download names (for links on the website)
        shell: bash
        run: |
          cp release/CAGE-BOSS-*-setup.exe release/CAGE-BOSS-Setup.exe
          cp release/CAGE-BOSS-*-portable.exe release/CAGE-BOSS-Portable.exe
      - uses: actions/upload-artifact@v4
        with:
          name: CAGE-BOSS-windows
          path: |
            release/*.exe
            release/*.blockmap
            release/latest.yml
          if-no-files-found: error

  mac:
    needs: check
    if: needs.check.outputs.allplatforms == 'true'
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Version from tag
        if: startsWith(github.ref, 'refs/tags/v')
        run: npm version "${GITHUB_REF_NAME#v}" --no-git-tag-version --allow-same-version
      - run: npm run dist:mac
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      - name: Stable download names (for links on the website)
        run: |
          cp release/CAGE-BOSS-*-mac-arm64.dmg release/CAGE-BOSS-Mac-AppleSilicon.dmg
          cp release/CAGE-BOSS-*-mac-x64.dmg release/CAGE-BOSS-Mac-Intel.dmg
      - uses: actions/upload-artifact@v4
        with:
          name: CAGE-BOSS-mac
          path: |
            release/*.dmg
            release/*.zip
            release/*.blockmap
            release/latest-mac.yml
          if-no-files-found: error

  linux:
    needs: check
    if: needs.check.outputs.allplatforms == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Version from tag
        if: startsWith(github.ref, 'refs/tags/v')
        run: npm version "${GITHUB_REF_NAME#v}" --no-git-tag-version --allow-same-version
      - run: npm run dist:linux
      - name: Stable download names (for links on the website)
        run: |
          cp release/CAGE-BOSS-*-linux-x86_64.AppImage release/CAGE-BOSS-Linux.AppImage
          cp release/CAGE-BOSS-*-linux-x64.tar.gz release/CAGE-BOSS-Linux.tar.gz
      - uses: actions/upload-artifact@v4
        with:
          name: CAGE-BOSS-linux
          path: |
            release/*.AppImage
            release/*.tar.gz
            release/latest-linux.yml
          if-no-files-found: error

  release:
    needs: [check, windows, mac, linux]
    # Windows must have built; a Mac or Linux failure doesn't hold the release back
    if: always() && needs.check.outputs.release == 'true' && needs.windows.result == 'success'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: out
          merge-multiple: true
      # release notes come from the commit message (the website's "What's new" reads them)
      - name: Release notes
        shell: bash
        env:
          MSG: ${{ github.event.head_commit.message }}
        run: |
          printf '%s\n' "${MSG:-New build of CAGE BOSS.}" | grep -viE '^(co-authored-by|claude-session):' > release-notes.md || echo "New build of CAGE BOSS." > release-notes.md
      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          fail_on_unmatched_files: false
          tag_name: ${{ needs.check.outputs.tag }}
          target_commitish: ${{ github.sha }}
          name: CAGE BOSS ${{ needs.check.outputs.tag }}
          body_path: release-notes.md
          # latest*.yml + .blockmap are what installed copies read to update themselves
          files: |
            out/*.exe
            out/*.dmg
            out/*.zip
            out/*.AppImage
            out/*.tar.gz
            out/*.blockmap
            out/latest.yml
            out/latest-mac.yml
            out/latest-linux.yml
