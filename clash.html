<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <meta name="theme-color" content="#12100f" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="description" content="UNIVERSE CLASH - an ink-and-blood platform fighter. Eight universes. One stage. No blocking." />
    <title>UNIVERSE CLASH</title>
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' fill='%23efe6d2'/%3E%3Cpath d='M8 46 32 8l24 38-24-10z' fill='%23d8242c' stroke='%2312100f' stroke-width='5'/%3E%3C/svg%3E" />
    <link rel="stylesheet" href="/src/clash/style.css" />
  </head>
  <body>
    <div id="clash-root" data-screen="boot">
      <canvas id="clash-canvas" aria-label="Universe Clash game"></canvas>
      <div id="vignette" aria-hidden="true"></div>
      <div id="scanlines" aria-hidden="true"></div>
      <div id="hud" class="hud hidden" aria-live="polite"></div>
      <div id="screen" class="screen"></div>
      <div id="toast"></div>
      <div id="perf" class="perf hidden"></div>
      <div id="boot" class="boot">
        <div class="boot-mark">UC</div>
        <div class="boot-bar"><i></i></div>
        <div class="boot-text">INKING THE PANELS</div>
      </div>
    </div>
    <script type="module" src="/src/clash-main.ts"></script>
  </body>
</html>
