<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="theme-color" content="#0d0b0c" />
    <meta name="format-detection" content="telephone=no" />
    <meta name="apple-mobile-web-app-title" content="CAGE BOSS" />
    <!-- web version (506clicks.ca/play/cageboss): Add to Home Screen icon + install manifest -->
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="icon" type="image/png" href="/icon-192.png" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <title>CAGE BOSS</title>
    <style>
      html, body {
        margin: 0; height: 100%; background: #0d0b0c; overflow: hidden;
        /* phones: no scroll, bounce, double-tap zoom, text selection or long-press callouts */
        touch-action: none; overscroll-behavior: none; -webkit-text-size-adjust: 100%;
        -webkit-user-select: none; user-select: none; -webkit-touch-callout: none; -webkit-tap-highlight-color: transparent;
      }
      /* the game box stays clear of notches / home indicators (safe-area insets are 0 elsewhere) */
      #game {
        position: absolute; display: flex; align-items: center; justify-content: center;
        top: env(safe-area-inset-top, 0px); right: env(safe-area-inset-right, 0px);
        bottom: env(safe-area-inset-bottom, 0px); left: env(safe-area-inset-left, 0px);
      }
      #game canvas { image-rendering: pixelated; image-rendering: crisp-edges; display: block; }
      /* controller cursor active: hide the OS pointer over the game */
      body.pad-cursor #game canvas { cursor: none !important; }
      #dom-overlay { position: absolute; left: 0; top: 0; pointer-events: none; }
      #dom-overlay input, #dom-overlay textarea {
        pointer-events: auto; position: absolute; box-sizing: border-box;
        font-family: monospace; background: #e8dfc8; color: #2a2226; border: 2px solid #2a2226;
        -webkit-user-select: text; user-select: text;
      }
      /* touch zoom buttons (src/ui/touch.ts) */
      #zoom-ui { position: fixed; z-index: 20; display: none; flex-direction: column; gap: 6px; width: 34px; }
      #zoom-ui button {
        width: 34px; height: 34px; padding: 0; border: 2px solid #9a939c; border-radius: 0;
        background: #262128; color: #e6dcc4; font: bold 14px monospace; box-shadow: 2px 2px 0 #000;
      }
      #zoom-ui button:active { background: #4c4652; transform: translate(1px, 1px); box-shadow: 1px 1px 0 #000; }
      /* portrait phone: ask for landscape */
      #rotate {
        display: none; position: fixed; inset: 0; z-index: 30; background: #0d0b0c; color: #e6dcc4;
        flex-direction: column; align-items: center; justify-content: center; gap: 14px;
        font: bold 16px monospace; letter-spacing: 2px; text-align: center; padding: 24px; box-sizing: border-box;
      }
      #rotate .t2 { font-size: 11px; color: #9a939c; letter-spacing: 1px; }
      #rotate .phone { image-rendering: pixelated; animation: cb-rotate 2.4s steps(1) infinite; }
      @keyframes cb-rotate { 0%, 45% { transform: rotate(0deg); } 50%, 95% { transform: rotate(-90deg); } }
      body.portrait #rotate { display: flex; }
      /* iPhone Safari: "add to Home Screen for full screen" tip (src/ui/touch.ts) */
      #a2hs {
        position: fixed; z-index: 25; left: 50%; transform: translateX(-50%); top: calc(env(safe-area-inset-top, 0px) + 6px);
        display: flex; align-items: center; gap: 10px; max-width: min(560px, 90vw); box-sizing: border-box;
        padding: 4px 4px 4px 10px; white-space: nowrap; background: #262128; color: #e6dcc4; border: 2px solid #c4a04a; box-shadow: 3px 3px 0 #000;
        font: 11px/1.3 monospace; opacity: 0.95;
      }
      #a2hs b { color: #c4a04a; white-space: nowrap; }
      #a2hs svg { vertical-align: -2px; }
      #a2hs button { flex: none; width: 26px; height: 26px; border: 2px solid #9a939c; background: #0d0b0c; color: #e6dcc4; font: bold 12px monospace; }
    </style>
  </head>
  <body>
    <div id="game"></div>
    <div id="dom-overlay"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
