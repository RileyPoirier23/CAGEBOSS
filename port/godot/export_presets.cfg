; Export presets for the Godot build (see docs/console/ENGINE.md and .github/workflows/godot.yml).
; data/, gen/ and public/ are produced by tools/gdport/build.sh before exporting.

[preset.0]

name="Windows"
platform="Windows Desktop"
runnable=true
dedicated_server=false
custom_features=""
export_filter="all_resources"
include_filter="data/*.json, data/**/*.json"
exclude_filter="tests/*"
export_path="build/windows/CAGE BOSS.exe"
encryption_include_filters=""
encryption_exclude_filters=""
encrypt_pck=false
encrypt_directory=false

[preset.0.options]

binary_format/embed_pck=true
binary_format/architecture="x86_64"
codesign/enable=false
application/modify_resources=false
application/product_name="CAGE BOSS"
application/company_name="506clicks"
application/file_description="CAGE BOSS"

